[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/"
]

# Celo network configuration
# Alfajores (being sunset Sept 30, 2025)
# Sepolia (new primary testnet) - using Ankr for best performance
[rpc_endpoints]
alfajores = "https://alfajores-forno.celo-testnet.org"
celo_sepolia = "https://rpc.ankr.com/celo_sepolia"

[etherscan]
alfajores = { key = "${CELOSCAN_API_KEY}", url = "https://api-alfajores.celoscan.io/api" }
celo_sepolia = { key = "${CELOSCAN_API_KEY}", url = "https://celo-sepolia.blockscout.com/api" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
